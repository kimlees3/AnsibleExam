---
- name: Make web contents
  hosts: webservers
  tasks: 
    - name: mkdr /webdev
      ansible.builtin.file:
        path: /webdev
        state: directory
        group: apache
        mode: '2775'

    
    - name: symbolink
      ansible.builtin.file:
        src: /webdev
        dest: /var/www/html/webdev
        group: apache
        state: link
    - name: configure selinux file context
      # semanage fcontext -a -t httpd_sys_content_t '/webdev(/.*)'
      # restorecon -r /webdev
      community.general.sefcontext:
        target: '/webdev(/.*)?'
        setype: httpd_sys_content_t
        state: present
    - name: selinux
      ansible.builtin.command: restorecon -irv /webdev

    - name: mk index.html in /webdev
      ansible.builtin.copy:
        content: 'WEBSERVERS'
        dest: /webdev/index.html
        mode: '0644'


