---
# tasks file for roles/apache
    ###################
    # 1) install pkg - httpd, firewalld, mod_ssl
    # 2) configure service - index.html.j2 --> /var/www/html/index.html
    # 3) start service - firewalld, httpd
    # 4) open the port - http, https
    ###################
- name: 1) install pkg - httpd, firewalld, mod_ssl
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  loop: 
    - httpd
    - firewalld
    - mod_ssl
- name: 2) configure service - index.html.j2 --> /var/www/html/index.html
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    mode: '0644'
- name: 3) start service - firewalld, httpd
  ansible.builtin.systemd:
    state: started
    name: "{{ item }}"
  loop: 
    - firewalld
    - httpd
- name: 4) open the port - http, https
  ansible.builtin.firewalld:
    service: "{{ item }}"
    state: enabled
    immediate: true
    permanent: true
  loop: 
    - http
    - https


